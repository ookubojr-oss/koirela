<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KoiRela | 運営管理</title>
<meta name="theme-color" content="#574E66">
<style>
:root{
  --plum:#574E66;--coral:#F2837B;--pink:#FBEAE8;--ink:#3A3547;--muted:#8F879A;
  --line:#EEE9F0;--white:#fff;--danger:#C85858;--green:#5AA876;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#F7F3F7;color:var(--ink)}
button,a{font:inherit}
a{color:inherit;text-decoration:none}
.shell{max-width:1180px;margin:0 auto;padding:28px 22px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:16px 16px 16px 6px;background:var(--plum);color:var(--coral);display:flex;align-items:center;justify-content:center;font-weight:800}.brand h1{font-size:19px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}
.top-actions{display:flex;gap:8px}.btn{border:0;border-radius:999px;padding:10px 14px;background:#fff;color:var(--plum);box-shadow:0 5px 16px rgba(87,78,102,.06);cursor:pointer}.btn.primary{background:var(--plum);color:#fff}.btn.danger{color:var(--danger)}
.notice{background:#FFF9F8;border:1px solid #F4D8D5;border-radius:18px;padding:13px 15px;font-size:11px;line-height:1.7;color:#7B6363;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid rgba(87,78,102,.05);border-radius:22px;padding:17px;box-shadow:0 8px 24px rgba(87,78,102,.045)}.stat small{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}.stat strong{font-size:24px}.stat span{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.status-active{color:var(--green)}.status-suspended{color:var(--danger)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.toolbar h2{font-size:16px;margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.chip{border:0;background:#fff;color:#6F6879;padding:8px 11px;border-radius:999px;font-size:10px;cursor:pointer}.chip.on{background:var(--plum);color:#fff}
.logs{display:flex;flex-direction:column;gap:10px}
.log{background:#fff;border:1px solid rgba(87,78,102,.06);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(87,78,102,.045)}
.log.overturned{opacity:.55}.log-head{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(100px,.6fr) minmax(120px,.7fr) minmax(130px,.9fr) auto;gap:10px;align-items:center;padding:14px 16px;cursor:pointer}.person{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#F6D6D2;color:var(--plum);display:flex;align-items:center;justify-content:center;font-weight:700}.person b{font-size:12px}.person small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.pill{display:inline-flex;width:max-content;border-radius:999px;padding:5px 8px;background:#FFF1F0;color:var(--danger);font-size:9px;font-weight:700}.pill.warning{background:#FFF5E8;color:#A96B27}.pill.reviewed{background:#EDF8F1;color:var(--green)}
.time,.action{font-size:10px;color:#6E6877;line-height:1.5}.chev{font-size:20px;color:#B8B1C0}
.log-body{display:none;border-top:1px solid var(--line);padding:16px}.log.open .log-body{display:block}.section-label{font-size:9px;color:var(--muted);font-weight:700;margin-bottom:7px}.message{background:#FBF8FA;border-radius:16px;padding:12px 13px;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.context{display:grid;gap:6px;margin-top:8px}.context div{font-size:10.5px;line-height:1.6;padding:9px 11px;border-left:3px solid #EEE8F1;background:#FCFAFC}.log-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.smallbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 11px;font-size:10px;cursor:pointer}.smallbtn.primary{background:var(--plum);border-color:var(--plum);color:#fff}.smallbtn.danger{color:var(--danger);border-color:#F0CACA}
.empty{text-align:center;background:#fff;border-radius:24px;padding:46px 20px;color:var(--muted)}.empty .heart{font-size:34px;color:var(--coral);margin-bottom:9px}.empty b{display:block;color:var(--ink);font-size:13px;margin-bottom:5px}.empty p{font-size:10.5px}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr}.log-head{grid-template-columns:1fr auto}.log-head>.type,.log-head>.time,.log-head>.action{display:none}.toolbar{align-items:flex-start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><div class="mark">K</div><div><h1>KoiRela 運営管理</h1><p>相談員の外部誘導・違反ログ</p></div></div>
    <div class="top-actions"><a class="btn" href="index.html#counselor">アプリを見る</a><button class="btn primary" type="button" onclick="refresh()">更新</button></div>
  </div>

  <div class="notice"><b>デモ管理画面です。</b> 現在は同じブラウザのローカル保存データを表示しています。本番では運営者認証、権限制御、サーバー側ログ保存、監査ログ、保存期間の設定が必要です。</div>

  <div class="stats">
    <div class="stat"><small>相談員ステータス</small><strong id="stat-status">—</strong><span id="stat-status-sub">—</span></div>
    <div class="stat"><small>有効な違反</small><strong id="stat-strikes">0 / 2</strong><span>2回目で自動停止</span></div>
    <div class="stat"><small>未確認ログ</small><strong id="stat-unreviewed">0</strong><span>運営確認待ち</span></div>
    <div class="stat"><small>保存ログ</small><strong id="stat-total">0</strong><span>最大100件（デモ）</span></div>
  </div>

  <div class="toolbar">
    <h2>違反ログ</h2>
    <div class="filters">
      <button class="chip on" data-filter="all">すべて</button>
      <button class="chip" data-filter="unreviewed">未確認</button>
      <button class="chip" data-filter="warning">警告</button>
      <button class="chip" data-filter="suspended">停止</button>
    </div>
  </div>
  <div id="logs" class="logs"></div>
</div>

<script>
const MODERATION_LOG_KEY='koirela_moderation_logs_v1';
const COUNSELOR_STATE_KEY='koirela_counselor_state_v1';
let filter='all';

function getState(){
  try{const x=JSON.parse(localStorage.getItem(COUNSELOR_STATE_KEY)||'null');return x&&typeof x==='object'?{violations:Number(x.violations)||0,suspended:!!x.suspended}:{violations:0,suspended:false}}catch(_){return {violations:0,suspended:false}}
}
function saveState(x){localStorage.setItem(COUNSELOR_STATE_KEY,JSON.stringify(x))}
function getLogs(){
  try{const x=JSON.parse(localStorage.getItem(MODERATION_LOG_KEY)||'[]');return Array.isArray(x)?x:[]}catch(_){return []}
}
function saveLogs(x){localStorage.setItem(MODERATION_LOG_KEY,JSON.stringify(x))}
function esc(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(iso){
  try{return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}catch(_){return iso||'—'}
}
function filtered(logs){
  return logs.filter(log=>{
    if(filter==='unreviewed')return !log.reviewed&&!log.overturned;
    if(filter==='warning')return log.strike===1&&!log.overturned;
    if(filter==='suspended')return log.strike>=2&&!log.overturned;
    return true;
  })
}
function render(){
  const state=getState(),logs=getLogs();
  const status=document.getElementById('stat-status');
  status.textContent=state.suspended?'停止中':'利用可能';
  status.className=state.suspended?'status-suspended':'status-active';
  document.getElementById('stat-status-sub').textContent=state.suspended?'新規相談の受付不可':'相談員モード利用可能';
  document.getElementById('stat-strikes').textContent=state.violations+' / 2';
  document.getElementById('stat-unreviewed').textContent=logs.filter(x=>!x.reviewed&&!x.overturned).length;
  document.getElementById('stat-total').textContent=logs.length;

  const shown=filtered(logs);
  const box=document.getElementById('logs');
  if(!shown.length){
    box.innerHTML='<div class="empty"><div class="heart">♡</div><b>該当するログはありません</b><p>相談員側で外部誘導が検知されるとここに表示されます。</p></div>';
    return;
  }
  box.innerHTML=shown.map(log=>{
    const cls=log.overturned?'log overturned':'log';
    const pill=log.overturned?'<span class="pill reviewed">誤検知取消済み</span>':(log.strike>=2?'<span class="pill">2回目・停止</span>':'<span class="pill warning">1回目・警告</span>');
    const review=log.reviewed?'<span class="pill reviewed">確認済み</span>':'';
    const context=(log.context||[]).map(x=>'<div>'+esc(x)+'</div>').join('')||'<div>前後メッセージなし</div>';
    return '<article class="'+cls+'" data-id="'+esc(log.id)+'">'+
      '<div class="log-head" onclick="toggleLog(this.parentElement)">'+
        '<div class="person"><div class="avatar">あ</div><div><b>'+esc(log.counselorName||'相談員')+'</b><small>'+esc(log.counselorId||'—')+'</small></div></div>'+
        '<div class="type">'+pill+' '+review+'</div>'+
        '<div class="time">'+fmt(log.occurredAt)+'</div>'+
        '<div class="action">'+esc(log.action||'—')+'</div>'+
        '<div class="chev">⌄</div>'+
      '</div>'+
      '<div class="log-body">'+
        '<div class="section-label">検知理由</div><div class="message">'+esc(log.type||'外部連絡先')+'</div>'+
        '<div class="section-label" style="margin-top:14px">送信しようとした内容</div><div class="message">'+esc(log.attemptedMessage||'')+'</div>'+
        '<div class="section-label" style="margin-top:14px">直前の会話（最大3件）</div><div class="context">'+context+'</div>'+
        '<div class="log-actions">'+
          (!log.reviewed?'<button class="smallbtn primary" onclick="markReviewed(\''+esc(log.id)+'\')">確認済みにする</button>':'')+
          (!log.overturned?'<button class="smallbtn" onclick="overturn(\''+esc(log.id)+'\')">誤検知として取り消す</button>':'')+
          (state.suspended?'<button class="smallbtn danger" onclick="restoreAccount()">停止を解除</button>':'')+
        '</div>'+
      '</div>'+
    '</article>';
  }).join('');
}
function toggleLog(el){el.classList.toggle('open')}
function markReviewed(id){const logs=getLogs();const x=logs.find(v=>v.id===id);if(x)x.reviewed=true;saveLogs(logs);render()}
function overturn(id){
  const logs=getLogs();const x=logs.find(v=>v.id===id);if(x){x.overturned=true;x.reviewed=true}
  saveLogs(logs);
  const valid=logs.filter(v=>!v.overturned);
  const count=Math.min(2,valid.length);
  saveState({violations:count,suspended:count>=2});
  render();
}
function restoreAccount(){
  if(!confirm('相談員アカウントの停止を解除しますか？ 次回の違反で再停止されます。'))return;
  saveState({violations:1,suspended:false,manualOverrideAt:new Date().toISOString()});
  render();
}
function refresh(){render()}
document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));btn.classList.add('on');filter=btn.dataset.filter;render();
}));
window.addEventListener('storage',render);
render();
</script>
</body>
</html>
