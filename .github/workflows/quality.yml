name: quality

on:
  pull_request:
  push:
    branches:
      - feature/production-foundation

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Supabase Edge Functions
        run: |
          deno check supabase/functions/create-payment-intent/index.ts
          deno check supabase/functions/create-extension-payment-intent/index.ts
          deno check supabase/functions/start-consultation/index.ts
          deno check supabase/functions/end-consultation/index.ts
          deno check supabase/functions/cancel-consultation/index.ts
          deno check supabase/functions/send-message/index.ts
          deno check supabase/functions/moderate-message/index.ts
          deno check supabase/functions/set-counselor-availability/index.ts
          deno check supabase/functions/submit-counselor-application/index.ts
          deno check supabase/functions/update-counselor-profile/index.ts
          deno check supabase/functions/admin-operations/index.ts
          deno check supabase/functions/delete-account/index.ts
          deno check supabase/functions/admin-process-payout/index.ts
          deno check supabase/functions/payout-connect/index.ts
          deno check supabase/functions/line-auth-callback/index.ts
          deno check supabase/functions/line-auth-start/index.ts
          deno check supabase/functions/report-error/index.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --ignore-scripts

      - name: Typecheck mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Validate required production files
        run: |
          test -f supabase/migrations/20260920_000009_product_completion.sql
          test -f admin-live.html
          test -f mobile/App.tsx
          test -f docs/PRODUCTION_CHECKLIST.md
