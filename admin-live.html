<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KoiRela 運営管理</title>
<style>
:root{--plum:#574E66;--coral:#F2837B;--bg:#F7F3F7;--text:#37313F;--muted:#8A8292;--line:#EDE7EF;--danger:#C85858}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--text)}
button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:26px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:16px 16px 16px 6px;background:var(--plum);color:var(--coral);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:10px;color:var(--muted);margin:2px 0 0}.top-actions{display:flex;gap:7px}.button{border:0;background:#fff;color:var(--plum);border-radius:999px;padding:10px 14px;cursor:pointer}.button.primary{background:var(--plum);color:#fff}
.status{background:#fff;border-radius:14px;padding:10px 13px;font-size:10px;color:var(--muted);margin-bottom:16px}.status.danger{color:var(--danger);background:#FFF1F1}
.auth{max-width:420px;margin:50px auto;background:#fff;border-radius:26px;padding:24px}.auth h2{text-align:center}.field{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;padding:0 13px;margin-bottom:9px}.auth .button{width:100%;height:50px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.ops-card{background:#fff;border-radius:20px;padding:16px}.ops-card small{font-size:9px;color:var(--muted)}.ops-card strong{display:block;font-size:20px;margin-top:5px}.section-block{margin:28px 0}.section-block h2{font-size:15px}.table-wrap{overflow:auto;background:#fff;border-radius:20px}.ops-table{width:100%;border-collapse:collapse;min-width:720px}.ops-table th,.ops-table td{font-size:9.5px;text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}.ops-table th{color:var(--muted);font-weight:700}.ops-table tr:last-child td{border-bottom:0}.ticket-card{background:#fff;border-radius:20px;padding:15px;margin-bottom:8px}.ticket-top{display:flex;justify-content:space-between;gap:10px}.ticket-top b{font-size:12px}.ticket-top span{font-size:9px;color:var(--coral);font-weight:800}.ticket-body{font-size:10px;line-height:1.7;color:var(--muted);margin:8px 0}.ticket-reply{width:100%;min-height:74px;border:1px solid var(--line);border-radius:14px;padding:10px;resize:vertical}.maintenance-box{background:#fff;border-radius:20px;padding:16px;display:grid;gap:9px}.maintenance-box input,.maintenance-box textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:10px}.maintenance-box textarea{min-height:84px;resize:vertical}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{background:#fff;border-radius:20px;padding:16px}.stat small{font-size:9px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:6px}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}.search{height:42px;min-width:260px;border:1px solid var(--line);border-radius:14px;padding:0 12px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:0;border-radius:999px;padding:8px 11px;background:#fff;color:var(--muted);cursor:pointer}.filter.on{background:var(--plum);color:#fff}
.live-logs{display:grid;gap:9px}.live-log{background:#fff;border-radius:20px;overflow:hidden}.live-log-head{width:100%;border:0;background:#fff;display:grid;grid-template-columns:1fr auto 150px 20px;gap:12px;align-items:center;text-align:left;padding:14px 16px;cursor:pointer}.live-log-head span:first-child{display:flex;flex-direction:column;gap:3px}.live-log-head b{font-size:12px}.live-log-head small,.live-log-head time{font-size:9px;color:var(--muted)}.pill{font-size:9px;font-weight:800;background:#FFF5E9;color:#A96B27;padding:6px 8px;border-radius:999px}.pill.danger{background:#FFF0F0;color:var(--danger)}.live-log-body{border-top:1px solid var(--line);padding:15px}.live-log-body h4{font-size:9px;color:var(--muted);margin:12px 0 6px}.message,.context div{background:#FAF7FA;border-radius:14px;padding:11px;font-size:11px;line-height:1.65}.context{display:grid;gap:5px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid var(--line);border-radius:999px;background:#fff;padding:9px 11px;cursor:pointer}.actions .danger-button{color:var(--danger)}
.applications{margin:26px 0}.applications h2,.audit h2{font-size:15px}.application-list{display:grid;gap:9px}.application-card{background:#fff;border-radius:20px;padding:16px}.application-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.application-head b{font-size:13px}.application-head small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.application-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.application-meta div{background:#FAF7FA;border-radius:13px;padding:10px}.application-meta span{display:block;font-size:8px;color:var(--muted);margin-bottom:3px}.application-meta strong{font-size:10px}.application-docs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.application-docs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;cursor:pointer}.application-actions{display:flex;gap:7px;margin-top:13px}.application-actions button{border:0;border-radius:999px;padding:9px 13px;cursor:pointer}.application-actions .approve{background:var(--plum);color:#fff}.application-actions .reject{background:#FFF0F0;color:var(--danger)}
.audit{margin-top:28px}.audit h2{font-size:15px}.audit-list{background:#fff;border-radius:20px;overflow:hidden}.audit-row{display:grid;grid-template-columns:170px 180px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:10px}.audit-row:last-child{border:0}.audit-row time,.audit-row span{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.ops-grid{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.search{min-width:0;width:100%}.live-log-head{grid-template-columns:1fr auto}.live-log-head time,.live-log-head i{display:none}.audit-row{grid-template-columns:1fr}.application-meta{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div class="logo">K</div><div><h1>KoiRela 運営管理</h1><p>本番バックエンド接続版</p></div></div>
    <div class="top-actions"><button id="admin-refresh" class="button">更新</button><button id="admin-logout" class="button">ログアウト</button></div>
  </div>
  <div id="admin-status" class="status">接続確認中…</div>

  <section id="auth-view" class="auth" hidden>
    <h2>運営ログイン</h2>
    <form id="admin-login-form">
      <input id="admin-email" class="field" type="email" autocomplete="username" placeholder="メールアドレス" required>
      <input id="admin-password" class="field" type="password" autocomplete="current-password" placeholder="パスワード" required>
      <button class="button primary" type="submit">ログイン</button>
    </form>
  </section>

  <main id="dashboard-view" hidden>
    <div class="stats">
      <div class="stat"><small>未確認</small><strong id="stat-unreviewed">0</strong></div>
      <div class="stat"><small>停止中相談員</small><strong id="stat-suspended">0</strong></div>
      <div class="stat"><small>違反イベント</small><strong id="stat-events">0</strong></div>
      <div class="stat"><small>未処理通報</small><strong id="stat-reports">0</strong></div>
    </div>
    <div class="ops-grid">
      <div class="ops-card"><small>登録ユーザー</small><strong id="analytics-users">0</strong></div>
      <div class="ops-card"><small>今月の相談完了</small><strong id="analytics-completed">0</strong></div>
      <div class="ops-card"><small>今月売上</small><strong id="analytics-gross">0円</strong></div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter on" data-filter="all">すべて</button>
        <button class="filter" data-filter="unreviewed">未確認</button>
        <button class="filter" data-filter="warning">警告</button>
        <button class="filter" data-filter="suspended">停止</button>
        <button class="filter" data-filter="report">ユーザー通報</button>
      </div>
      <input id="admin-search" class="search" type="search" placeholder="相談員名・内容・理由で検索">
    </div>

    <div id="live-logs" class="live-logs"></div>

    <section class="applications">
      <h2>相談員申請</h2>
      <div id="application-list" class="application-list"></div>
    </section>

    <section class="section-block">
      <h2>相談員管理</h2>
      <div class="table-wrap"><table class="ops-table"><thead><tr><th>表示名</th><th>ID</th><th>審査</th><th>状態</th><th>操作</th></tr></thead><tbody id="counselor-rows"></tbody></table></div>
    </section>

    <section class="section-block">
      <h2>相談・決済</h2>
      <div class="table-wrap"><table class="ops-table"><thead><tr><th>日時</th><th>相談ID</th><th>状態</th><th>料金</th><th>決済</th><th>操作</th></tr></thead><tbody id="consultation-rows"></tbody></table></div>
    </section>

    <section class="section-block">
      <h2>お問い合わせ</h2>
      <div id="support-list"></div>
    </section>

    <section class="section-block">
      <h2>アカウント削除申請</h2>
      <div class="table-wrap"><table class="ops-table"><thead><tr><th>申請日時</th><th>ユーザーID</th><th>状態</th><th>操作</th></tr></thead><tbody id="deletion-rows"></tbody></table></div>
    </section>

    <section class="section-block">
      <h2>メンテナンス告知</h2>
      <div class="maintenance-box">
        <div class="toggle-row"><b>メンテナンスモード</b><label><input id="maintenance-enabled" type="checkbox"> 有効</label></div>
        <input id="maintenance-title" type="text" maxlength="120" placeholder="タイトル">
        <textarea id="maintenance-message" maxlength="500" placeholder="ユーザーに表示する内容"></textarea>
        <button id="maintenance-save" class="button primary">保存</button>
      </div>
    </section>

    <section class="audit">
      <h2>運営操作履歴</h2>
      <div id="audit-list" class="audit-list"></div>
    </section>
  </main>
</div>
<script src="./web/config.js"></script>
<script type="module" src="./web/admin-live.js"></script>
</body>
</html>
